name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository check | Controllo repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test | Lint, typecheck e test
        run: pnpm check

      # The extension is the only shipped deliverable. Without this step CI can
      # be green while the thing users install does not build.
      # L'estensione e l'unico deliverable: senza questo passo la CI puo essere
      # verde mentre cio che l'utente installa non compila.
      - name: Build the browser extension | Build dell'estensione
        run: pnpm build

      # SECURITY.md promises dependency scanning. Reported, not blocking: an
      # unrelated advisory should not stop an unrelated pull request.
      # Segnalato, non bloccante: un advisory non correlato non deve bloccare
      # una pull request non correlata.
      - name: Audit dependencies | Audit delle dipendenze
        run: pnpm audit --audit-level=high
        continue-on-error: true
